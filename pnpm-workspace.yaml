overrides:
  '@react-native/metro-config': 0.88.0-rc.1
  postcss: 8.5.23
  react-dom: 19.3.0
  react-native-reanimated: 4.6.0
  react-native-worklets: 0.12.2

auditConfig:
  ignoreCves:
    - CVE-2025-71330
    - CVE-2025-71329

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Explicit SDK 58 prerelease versions selected by Expo's upgrade command.
minimumReleaseAgeExclude:
  - '@expo/cli@58.0.5'
  - expo-asset@58.0.5
  - expo-constants@58.0.5
  - expo-file-system@58.0.1
  - expo-modules-core@58.0.5
  - expo@58.0.0-preview.5
  - '@expo/metro-runtime@58.0.5'
  - expo-document-picker@58.0.1
  - expo-glass-effect@58.0.2
  - expo-linking@58.0.5
  - expo-router@58.0.6
  - expo-sharing@58.0.8
