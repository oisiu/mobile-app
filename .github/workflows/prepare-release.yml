# Preparation is manual; merging its PR starts the Android testing pipeline.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        type: choice
        options: [patch, minor, major]
      platform:
        description: Platform (iOS/TestFlight coming soon)
        required: true
        type: choice
        options: [Android]
      notes_en:
        description: English release notes (maximum 500 characters)
        required: false
        type: string
        default: General updates and improvements.
      notes_es:
        description: Spanish release notes (maximum 500 characters)
        required: false
        type: string
        default: Actualizaciones y mejoras generales.

permissions: {}

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  main-only:
    name: Require manual dispatch from main
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Reject branches, tags, and pull requests
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Release workflows can only run manually from main.'
            exit 1
          fi

  prepare:
    needs: main-only
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      actions: write

    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Prepare version and bilingual release notes
        id: release
        run: node scripts/release/android.cjs prepare
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_NOTES_EN: ${{ inputs.notes_en }}
          RELEASE_NOTES_ES: ${{ inputs.notes_es }}
      - name: Push preparation branch, create PR, and start CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$RELEASE_BRANCH"
          git add package.json app.json .github/releases/ store/google-play/releases/
          git commit -m "Prepare Android release $RELEASE_TAG"
          gh auth setup-git
          git push origin "$RELEASE_BRANCH"
          PR_BODY=$(mktemp)
          trap 'rm -f "$PR_BODY"' EXIT
          cat > "$PR_BODY" <<EOF
          Prepare Android release $RELEASE_TAG with an incremented version code and bilingual release notes.

          Review the English and Spanish notes in store/google-play/releases/$RELEASE_VERSION.txt and wait for CI before merging into main.

          Merging starts Build Android release; a successful build submits the saved bundle to closed testing. Production publishing remains manual.
          EOF
          PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$RELEASE_BRANCH" --title "Prepare Android release $RELEASE_TAG" --body-file "$PR_BODY")
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Prepare $RELEASE_TAG

          [Review the release PR]($PR_URL)

          1. Review or edit the English and Spanish release notes in store/google-play/releases/$RELEASE_VERSION.txt on that branch.
          2. Wait for CI to pass, then manually merge the PR. Auto-merge is not enabled.
          3. Merging starts Build Android release automatically; a successful build starts closed testing.

          CI is dispatched on $RELEASE_BRANCH. If dispatch fails, run Actions → CI → Run workflow on that branch. If GitHub shows approval-required PR workflows, use Approve workflows to run. After editing the branch, wait for checks on its latest commit.
          EOF
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"
