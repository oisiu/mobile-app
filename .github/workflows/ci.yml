name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Sequential quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Actions stops this serial pipeline when any step fails.
      - name: 1. Knip
        run: pnpm deadcode
      - name: 2. Lint
        run: pnpm lint
      - name: 3. Typecheck
        run: pnpm typecheck
      - name: 4. Test
        run: pnpm test:coverage
      - name: 5. Expo Doctor
        run: pnpm run doctor
      - name: 6. Dependency audit
        run: pnpm run audit
      - name: 7. Build Android and iOS bundles
        run: pnpm build

      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: domain-coverage
          path: coverage
          if-no-files-found: error
          retention-days: 14
