name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate prepared release notes
        run: |
          if [ -f ".github/releases/v$(node -p 'require("./package.json").version').json" ]; then
            node scripts/release/android.cjs validate-notes
          fi
      - name: Check whitespace
        run: git diff --check
      - name: Dependency compatibility
        run: pnpm deps:check
      - name: Expo dependency alignment
        run: pnpm expo install --check
      - name: Knip
        run: pnpm deadcode
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  tests:
    name: Tests and coverage
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: domain-coverage
          path: coverage
          if-no-files-found: error
          retention-days: 14

  project-health:
    name: Project health
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Expo Doctor
        run: pnpm run doctor
      - name: Dependency audit
        run: pnpm run audit

  build:
    name: Build application bundles
    needs: project-health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Android and iOS bundles
        run: pnpm build

  required-ci-gate:
    name: Required CI gate
    if: ${{ always() }}
    needs: [static-checks, tests, project-health, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to succeed
        env:
          STATIC_CHECKS_RESULT: ${{ needs.static-checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          PROJECT_HEALTH_RESULT: ${{ needs.project-health.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$STATIC_CHECKS_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$PROJECT_HEALTH_RESULT" = success
          test "$BUILD_RESULT" = success
