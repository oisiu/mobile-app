# Build preparation merges automatically; manual dispatch supports build retries.
name: Build Android release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/releases/*.json']

permissions: {}

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  main-only:
    name: Require trusted main release trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Reject branches, tags, and pull requests
        run: |
          if { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$GITHUB_EVENT_NAME" != push ]; } || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Builds require a preparation merge or manual dispatch from main.'
            exit 1
          fi

  build:
    environment: google-play-build
    needs: main-only
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
      pull-requests: read

    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Select prepared version from main
        run: node scripts/release/android.cjs select
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require merged preparation and release notes
        run: node scripts/release/android.cjs validate-build
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Required checks
        run: |
          pnpm run doctor
          pnpm expo install --check
          pnpm verify
          pnpm test
          pnpm run audit
          pnpm build
          git diff --check
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify signing with a synthetic key and archive
        run: pnpm test:release:signing
      - name: Generate Android and disable template debug signing
        run: |
          pnpm expo prebuild --platform android --no-install
          cat > "$RUNNER_TEMP/unsigned.gradle" <<'EOF'
          allprojects {
              plugins.withId('com.android.application') {
                  androidComponents.finalizeDsl { android ->
                      android.buildTypes.getByName('release').signingConfig = null
                  }
              }
          }
          EOF
      - name: Build unsigned Android App Bundle
        working-directory: android
        run: ./gradlew :app:bundleRelease --init-script "$RUNNER_TEMP/unsigned.gradle" --console=plain --stacktrace
      - name: Sign with upload key and record bundle checksum
        run: node scripts/release/android.cjs sign
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Save signed build as a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          gh release create "$RELEASE_TAG" release-output/oisiu.aab release-output/build.json \
            --verify-tag --draft --title "Android $RELEASE_TAG" \
            --notes "Signed Android bundle. Closed testing starts automatically after this build succeeds."
