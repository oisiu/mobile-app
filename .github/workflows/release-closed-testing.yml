# Release stages are manual only. Run from main; no push/tag/workflow_run triggers.
name: Release to closed testing

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  main-only:
    name: Require manual dispatch from main
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Reject branches, tags, and pull requests
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Release workflows can only run manually from main.'
            exit 1
          fi

  publish:
    needs: main-only
    if: github.ref == 'refs/heads/main'
    environment: google-play-testing
    permissions:
      contents: write
      actions: read

    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Select prepared version from main
        run: node scripts/release/android.cjs select
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify successful build and submit to closed testing
        run: node scripts/release/android.cjs closed
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSED_TESTING_TRACK: ${{ vars.CLOSED_TESTING_TRACK }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
