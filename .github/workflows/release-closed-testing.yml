# Successful Android builds start testing; manual dispatch supports upload retries.
name: Release to closed testing

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Android release]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  main-only:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.id == github.repository_id &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    name: Require trusted main release trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Reject branches, tags, and pull requests
        run: |
          if { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$GITHUB_EVENT_NAME" != workflow_run ]; } || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Testing requires a successful main build or manual dispatch from main.'
            exit 1
          fi

  publish:
    needs: main-only
    if: github.ref == 'refs/heads/main'
    environment: google-play-testing
    permissions:
      contents: write
      actions: read

    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Select prepared version from main
        run: node scripts/release/android.cjs select
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify successful build and submit to closed testing
        run: node scripts/release/android.cjs closed
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSED_TESTING_TRACK: ${{ vars.CLOSED_TESTING_TRACK }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
